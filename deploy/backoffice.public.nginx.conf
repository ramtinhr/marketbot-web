# Install in the host's TLS nginx AFTER provisioning this domain's certificate.
# The API remains private; the panel's nginx proxies the shared admin API.
server {
    listen 80;
    server_name backoffice.parscryptoexchange.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name backoffice.parscryptoexchange.com;
    ssl_certificate /etc/letsencrypt/live/backoffice.parscryptoexchange.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backoffice.parscryptoexchange.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
